# Kurzlebiges Testprojekt (ohne Traefik, ohne Verbindung nach außen). Auf dem VPS in /root/abfahrt:
#   docker compose -f docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from tests
#   docker compose -f docker-compose.test.yml down -v && docker image rm abfahrt-app:test
name: abfahrt-test

x-test-env: &test-env
  PUBLIC_ORIGIN: https://test.invalid
  ADMIN_1_EMAIL: admin@test.invalid
  ADMIN_1_PASSWORD: test-password-1234

services:
  db:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_DB: abfahrt
      POSTGRES_USER: abfahrt_owner
      POSTGRES_PASSWORD: test-owner-pw
      APP_DB_PASSWORD: test-app-pw
    volumes:
      - ./server/sql:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abfahrt_owner -d abfahrt"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks: [internal]

  app:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: abfahrt-app:test
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *test-env
      PGHOST: db
      PGDATABASE: abfahrt
      PGUSER: abfahrt_app
      PGPASSWORD: test-app-pw
      PRIZES: "meet:2,shirt:1"
      REVEAL_AT: "2099-01-01T00:00:00Z"
      DRAW_AT: "off"
      STATS_CACHE_MS: "0"
      VIBE_MIN_INTERVAL_SEC: "1"
      VIBE_MAX_PER_PLAYER: "2"
      RL_ADMIN_LOGIN_PER_15MIN: "5"
    networks: [internal]

  # gleiche DB, aber Live-Auslosung schon vorbei → prüft Verhalten nach reveal_at
  app-revealed:
    image: abfahrt-app:test
    depends_on:
      app:
        condition: service_healthy
    environment:
      <<: *test-env
      PGHOST: db
      PGDATABASE: abfahrt
      PGUSER: abfahrt_app
      PGPASSWORD: test-app-pw
      PRIZES: "meet:2,shirt:1"
      REVEAL_AT: "2000-01-01T00:00:00Z"
      DRAW_AT: "off"
      STATS_CACHE_MS: "0"
    networks: [internal]

  # eigene DB + automatische Auslosung, deren Zeitpunkt schon vorbei ist
  db-auto:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_DB: abfahrt
      POSTGRES_USER: abfahrt_owner
      POSTGRES_PASSWORD: test-owner-pw
      APP_DB_PASSWORD: test-app-pw
    volumes:
      - ./server/sql:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abfahrt_owner -d abfahrt"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks: [internal]

  app-auto:
    image: abfahrt-app:test
    depends_on:
      app:
        condition: service_healthy
      db-auto:
        condition: service_healthy
    environment:
      <<: *test-env
      PGHOST: db-auto
      PGDATABASE: abfahrt
      PGUSER: abfahrt_app
      PGPASSWORD: test-app-pw
      PRIZES: "meet:1,shirt:1"
      REVEAL_AT: "2099-01-01T00:00:00Z"
      DRAW_AT: "2000-01-01T00:00:00Z"
      AUTO_DRAW_CHECK_MS: "500"
    networks: [internal]

  tests:
    image: abfahrt-app:test
    depends_on:
      app-revealed:
        condition: service_healthy
      app-auto:
        condition: service_healthy
    environment:
      <<: *test-env
      API: http://app:3000
      API_REVEALED: http://app-revealed:3000
      API_AUTO: http://app-auto:3000
    command: ["node", "--test", "--test-concurrency=1", "test/*.test.js"]
    networks: [internal]

networks:
  internal:
    internal: true
